<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDining" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180c06" />
      <stop offset="50%" stop-color="#2d1305" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glowDining" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgDining)" />

  <circle cx="200" cy="180" r="140" fill="#f59e0b" opacity="0.12" filter="url(#glowDining)" />
  <circle cx="620" cy="280" r="150" fill="#ea580c" opacity="0.15" filter="url(#glowDining)" />

  <!-- Restaurant Menu & Booking UI Card -->
  <g transform="translate(130, 55)">
    <rect width="540" height="340" rx="16" fill="rgba(28, 17, 10, 0.85)" stroke="rgba(245, 158, 11, 0.25)" stroke-width="1.5" />
    
    <!-- Top Nav -->
    <rect width="540" height="46" rx="16" fill="rgba(255, 255, 255, 0.03)" />
    <circle cx="25" cy="23" r="5" fill="#ef4444" />
    <circle cx="42" cy="23" r="5" fill="#f59e0b" />
    <circle cx="59" cy="23" r="5" fill="#10b981" />
    <text x="270" y="28" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="700">LUMINA DINING — CULINARY SUITE</text>

    <!-- Food Item Card 1 -->
    <g transform="translate(30, 70)">
      <rect width="225" height="110" rx="12" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(245, 158, 11, 0.2)" />
      <!-- Plate circle -->
      <circle cx="55" cy="55" r="32" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="1.5" />
      <circle cx="55" cy="55" r="22" fill="#d97706" opacity="0.4" />
      <text x="100" y="42" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Truffle Risotto</text>
      <text x="100" y="62" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Artisan Mushrooms</text>
      <text x="100" y="85" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="13" font-weight="800">$28.50</text>
    </g>

    <!-- Food Item Card 2 -->
    <g transform="translate(285, 70)">
      <rect width="225" height="110" rx="12" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(245, 158, 11, 0.2)" />
      <!-- Plate circle -->
      <circle cx="55" cy="55" r="32" fill="rgba(234, 88, 12, 0.15)" stroke="#ea580c" stroke-width="1.5" />
      <circle cx="55" cy="55" r="22" fill="#ea580c" opacity="0.4" />
      <text x="100" y="42" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Seared Scallops</text>
      <text x="100" y="62" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Citrus Herb Glaze</text>
      <text x="100" y="85" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="13" font-weight="800">$34.00</text>
    </g>

    <!-- Table Reservation Status Bar -->
    <g transform="translate(30, 205)">
      <rect width="480" height="105" rx="12" fill="rgba(0, 0, 0, 0.35)" stroke="rgba(255, 255, 255, 0.08)" />
      <text x="20" y="30" fill="#fef08a" font-family="system-ui, sans-serif" font-size="12" font-weight="700">LIVE TABLE RESERVATION DISPATCH</text>
      
      <!-- Table Chips -->
      <rect x="20" y="50" width="95" height="38" rx="8" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" />
      <text x="67" y="74" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="700">Table 01: Booked</text>

      <rect x="135" y="50" width="95" height="38" rx="8" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" />
      <text x="182" y="74" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="700">Table 04: Active</text>

      <rect x="250" y="50" width="95" height="38" rx="8" fill="rgba(59, 130, 246, 0.15)" stroke="#3b82f6" />
      <text x="297" y="74" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="700">Table 08: Open</text>

      <rect x="365" y="50" width="95" height="38" rx="8" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" />
      <text x="412" y="74" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="700">Table 12: VIP</text>
    </g>
  </g>
</svg>