<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090514" />
      <stop offset="40%" stop-color="#1e1035" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <linearGradient id="polyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg3d)" />

  <!-- Ambient Light Orbs -->
  <circle cx="250" cy="220" r="150" fill="#9333ea" opacity="0.25" filter="url(#glow3d)" />
  <circle cx="580" cy="180" r="160" fill="#3b82f6" opacity="0.2" filter="url(#glow3d)" />

  <!-- 3D Perspective Plane Grid -->
  <g opacity="0.18" stroke="#a855f7" stroke-width="1.2">
    <!-- Perspective Horizon -->
    <line x1="0" y1="280" x2="800" y2="280" stroke="#c084fc" opacity="0.4" />
    <line x1="0" y1="310" x2="800" y2="310" />
    <line x1="0" y1="345" x2="800" y2="345" />
    <line x1="0" y1="385" x2="800" y2="385" />
    <line x1="0" y1="435" x2="800" y2="435" />
    <!-- Rays from vanishing point (400, 260) -->
    <line x1="400" y1="260" x2="-100" y2="450" />
    <line x1="400" y1="260" x2="50" y2="450" />
    <line x1="400" y1="260" x2="200" y2="450" />
    <line x1="400" y1="260" x2="320" y2="450" />
    <line x1="400" y1="260" x2="400" y2="450" />
    <line x1="400" y1="260" x2="480" y2="450" />
    <line x1="400" y1="260" x2="600" y2="450" />
    <line x1="400" y1="260" x2="750" y2="450" />
    <line x1="400" y1="260" x2="900" y2="450" />
  </g>

  <!-- Floating 3D Wireframe Polyhedron (Three.js Icosahedron Mesh) -->
  <g transform="translate(400, 165)">
    <!-- Back Mesh Faces -->
    <polygon points="0,-90 -80,-30 0,-10" fill="rgba(147, 51, 234, 0.25)" stroke="#c084fc" stroke-width="1.5" />
    <polygon points="0,-90 80,-30 0,-10" fill="rgba(99, 102, 241, 0.3)" stroke="#818cf8" stroke-width="1.5" />
    <polygon points="-80,-30 -70,55 0,-10" fill="rgba(59, 130, 246, 0.35)" stroke="#60a5fa" stroke-width="1.5" />
    <polygon points="80,-30 70,55 0,-10" fill="rgba(168, 85, 247, 0.35)" stroke="#c084fc" stroke-width="1.5" />
    <polygon points="-70,55 0,90 0,-10" fill="rgba(6, 182, 212, 0.4)" stroke="#22d3ee" stroke-width="1.5" />
    <polygon points="70,55 0,90 0,-10" fill="rgba(99, 102, 241, 0.45)" stroke="#818cf8" stroke-width="1.5" />

    <!-- Core Glowing Vertex Points -->
    <circle cx="0" cy="-90" r="4.5" fill="#f8fafc" />
    <circle cx="-80" cy="-30" r="4.5" fill="#f8fafc" />
    <circle cx="80" cy="-30" r="4.5" fill="#f8fafc" />
    <circle cx="0" cy="-10" r="5" fill="#ffffff" />
    <circle cx="-70" cy="55" r="4.5" fill="#f8fafc" />
    <circle cx="70" cy="55" r="4.5" fill="#f8fafc" />
    <circle cx="0" cy="90" r="4.5" fill="#f8fafc" />

    <!-- Orbital Rings -->
    <ellipse cx="0" cy="0" rx="140" ry="40" fill="none" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1.5" stroke-dasharray="6,6" transform="rotate(-18)" />
    <ellipse cx="0" cy="0" rx="130" ry="35" fill="none" stroke="rgba(34, 211, 238, 0.4)" stroke-width="1.5" stroke-dasharray="4,8" transform="rotate(25)" />
    <circle cx="120" cy="-40" r="5" fill="#38bdf8" />
  </g>

  <!-- Tech Badges Bar (Bottom overlay) -->
  <g transform="translate(180, 360)">
    <rect width="440" height="48" rx="24" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.2" />
    <text x="220" y="29" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0.5">
      Three.js • WebGL Graphics • PWA • React • Recharts
    </text>
  </g>
</svg>