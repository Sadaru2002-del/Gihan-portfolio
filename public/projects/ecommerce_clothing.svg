<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgShop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18051e" />
      <stop offset="50%" stop-color="#300d3b" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <filter id="glowShop" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgShop)" />

  <circle cx="200" cy="180" r="140" fill="#ec4899" opacity="0.18" filter="url(#glowShop)" />
  <circle cx="620" cy="260" r="150" fill="#f43f5e" opacity="0.15" filter="url(#glowShop)" />

  <!-- E-Commerce Store UI Showcase Card -->
  <g transform="translate(130, 55)">
    <rect width="540" height="340" rx="16" fill="rgba(24, 7, 30, 0.88)" stroke="rgba(236, 72, 153, 0.28)" stroke-width="1.5" />
    
    <!-- Top Nav -->
    <rect width="540" height="46" rx="16" fill="rgba(255, 255, 255, 0.03)" />
    <circle cx="25" cy="23" r="5" fill="#ef4444" />
    <circle cx="42" cy="23" r="5" fill="#f59e0b" />
    <circle cx="59" cy="23" r="5" fill="#10b981" />
    <text x="270" y="28" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="700">URBAN THREADS — E-COMMERCE CLOTHING STORE</text>

    <!-- Product Tile 1 -->
    <g transform="translate(30, 70)">
      <rect width="145" height="150" rx="12" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(236, 72, 153, 0.25)" />
      <!-- Apparel Icon Shape -->
      <path d="M 50 25 L 65 35 L 80 35 L 95 25 L 115 45 L 100 55 L 100 95 L 45 95 L 45 55 L 30 45 Z" fill="rgba(236, 72, 153, 0.3)" stroke="#f472b6" stroke-width="1.5" />
      <text x="72" y="115" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Heavyweight Tee</text>
      <text x="72" y="134" fill="#f472b6" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">$35.00</text>
    </g>

    <!-- Product Tile 2 -->
    <g transform="translate(195, 70)">
      <rect width="145" height="150" rx="12" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(236, 72, 153, 0.25)" />
      <!-- Hoodie Shape -->
      <path d="M 45 28 L 60 40 L 85 40 L 100 28 L 120 50 L 105 60 L 105 98 L 40 98 L 40 60 L 25 50 Z" fill="rgba(244, 63, 94, 0.3)" stroke="#fb7185" stroke-width="1.5" />
      <text x="72" y="115" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Oversized Hoodie</text>
      <text x="72" y="134" fill="#f472b6" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">$72.00</text>
    </g>

    <!-- Product Tile 3 -->
    <g transform="translate(360, 70)">
      <rect width="150" height="150" rx="12" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(236, 72, 153, 0.25)" />
      <!-- Jacket Shape -->
      <path d="M 50 25 L 68 35 L 82 35 L 100 25 L 122 45 L 108 55 L 108 95 L 42 95 L 42 55 L 28 45 Z" fill="rgba(168, 85, 247, 0.3)" stroke="#c084fc" stroke-width="1.5" />
      <text x="75" y="115" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Denim Chore Coat</text>
      <text x="75" y="134" fill="#f472b6" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">$110.00</text>
    </g>

    <!-- Checkout / Cart Strip -->
    <g transform="translate(30, 240)">
      <rect width="480" height="70" rx="10" fill="rgba(0, 0, 0, 0.35)" stroke="rgba(255, 255, 255, 0.08)" />
      <circle cx="45" cy="35" r="18" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1.2" />
      <text x="45" y="39" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">✓</text>
      
      <text x="78" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Seamless Cart &amp; Order Tracking</text>
      <text x="78" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Automated admin panel, inventory management, instant checkout</text>

      <rect x="370" y="20" width="95" height="30" rx="6" fill="#db2777" />
      <text x="417" y="39" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">CHECKOUT</text>
    </g>
  </g>
</svg>